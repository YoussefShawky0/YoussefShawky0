name: Generate profile metrics and snake

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Personal access token stored as a repository secret (see README of lowlighter/metrics)
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

    steps:
      # ---------- Snake (light + dark) ----------
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      # ---------- lowlighter/metrics ----------
      - name: Metrics - overview
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: overview.svg
          output_action: none
          config_timezone: Africa/Cairo
          base: header, activity, community

      - name: Metrics - contribution calendar
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: calendar.svg
          output_action: none
          config_timezone: Africa/Cairo
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Metrics - languages
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: languages.svg
          output_action: none
          config_timezone: Africa/Cairo
          base: ""
          plugin_languages: yes
          # Flutter platform runners add C/C++/CMake/Swift code that is not hand-written
          plugin_languages_ignored: c++, cmake, c, swift, objective-c
          plugin_languages_details: percentage
          plugin_languages_limit: 6

      - name: Collect metrics renders
        if: env.METRICS_TOKEN != ''
        run: |
          mkdir -p dist
          sudo cp /metrics_renders/*.svg dist/
          sudo chown -R "$(id -u)":"$(id -g)" dist
          ls -la dist

      # Everything above is published to the "output" branch, which the README reads from
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
